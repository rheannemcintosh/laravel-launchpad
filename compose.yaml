services:
    laravel.test:
        build:
            context: ./docker/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.4/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            VITE_PORT: '${VITE_PORT:-5173}'
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            mssql:
                condition: service_healthy
            mssql-init:
                condition: service_completed_successfully

    mssql:
        image: 'mcr.microsoft.com/mssql/server:2022-latest'
        platform: linux/amd64
        ports:
            - '127.0.0.1:${FORWARD_DB_PORT:-1433}:1433'
        environment:
            ACCEPT_EULA: 'Y'
            MSSQL_SA_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'sail-mssql:/var/opt/mssql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD-SHELL
                - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b
            interval: 10s
            timeout: 5s
            retries: 20
            start_period: 30s

    mssql-init:
        image: 'mcr.microsoft.com/mssql/server:2022-latest'
        platform: linux/amd64
        environment:
            MSSQL_SA_PASSWORD: '${DB_PASSWORD}'
            DB_DATABASE: '${DB_DATABASE:-laravel}'
        entrypoint: ['/bin/bash', '/usr/local/bin/create-databases.sh']
        volumes:
            - './docker/mssql/create-databases.sh:/usr/local/bin/create-databases.sh:ro'
        networks:
            - sail
        depends_on:
            mssql:
                condition: service_healthy
        restart: 'no'

networks:
    sail:
        driver: bridge

volumes:
    sail-mssql:
        driver: local
