name: deploy

# Starts by itself when a change is merged to main, and can be started by hand
# from the Actions tab. A merge only deploys when the repository has opted in with
# the DEPLOY_ON_MERGE variable, which the OIDC setup script sets (see the
# Deployment section of the README). A manual run always runs.
#
# A run builds and pushes the image, then updates the app. Updating the app needs the
# Azure sign-in that the OIDC setup script sets up, which comes after the first image
# exists (provisioning needs the image). So a manual run before that builds and pushes
# the image and finishes green with a notice instead of failing. A merge deploy with the
# sign-in missing is a real mistake, so that still fails.
#
# This does not wait for the tests workflow, which starts at the same moment. The
# safeguard is that the pull request's tests have already passed before it is
# merged, so require the `ci` check on main in the repository settings.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deploy at a time, and never cancel one that is already updating the app: a
# newer run waits its turn instead. GitHub keeps only the newest waiting run.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push the image to ghcr.io
  id-token: write # request an OIDC token for azure/login

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_ON_MERGE == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Names come from the repository name so nothing is hardcoded per app.
      # The provisioning and OIDC scripts must use the same names: a container
      # app called <repo> in the resource group rg-<repo>. Their naming rules are
      # in deploy/lib.sh, so change the two together.
      - name: Derive names
        run: |
          repo="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          app="${repo#*/}"
          {
            echo "IMAGE=ghcr.io/${repo}"
            echo "APP_NAME=${app}"
            echo "RESOURCE_GROUP=rg-${app}"
          } >> "$GITHUB_ENV"

      # Whether the Azure sign-in is set up, from its three repository secrets. A secret
      # that is not set reads as empty here. Done before the build so a mistake on a
      # merge fails straight away, and because a step condition cannot read secrets.
      - name: Check the Azure sign-in is set up
        id: azure
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          EVENT: ${{ github.event_name }}
        run: |
          missing=""
          [ -n "$AZURE_CLIENT_ID" ] || missing="$missing AZURE_CLIENT_ID"
          [ -n "$AZURE_TENANT_ID" ] || missing="$missing AZURE_TENANT_ID"
          [ -n "$AZURE_SUBSCRIPTION_ID" ] || missing="$missing AZURE_SUBSCRIPTION_ID"
          missing="${missing# }"

          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            message="The image is built and pushed, but the app was not updated, because the Azure sign-in is not set up yet (missing secrets: ${missing// /, }). ./deploy/azure-oidc-setup.sh sets it up. Until then this is expected."
            echo "::notice title=Azure sign-in not set up yet::$message"
            echo "### Azure sign-in not set up yet" >> "$GITHUB_STEP_SUMMARY"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Azure sign-in is not set up::DEPLOY_ON_MERGE is on, so this merge should update the app, but these repository secrets are not set: ${missing// /, }. Run ./deploy/azure-oidc-setup.sh, or delete the DEPLOY_ON_MERGE variable to stop deploying on merge."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Container Apps runs linux/amd64.
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure login (OIDC)
        if: steps.azure.outputs.ready == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Deploy the commit-tagged image so every release is traceable and can be
      # rolled back.
      - name: Deploy to Container Apps
        if: steps.azure.outputs.ready == 'true'
        uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name ${{ env.APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.IMAGE }}:${{ github.sha }}
