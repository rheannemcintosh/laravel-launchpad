version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
      # laravel/wayfinder generates the app's TypeScript route types from what the
      # framework registers, so it has to be as new as the framework. The wait is applied
      # to each package separately, so with it a framework release can be proposed
      # without the Wayfinder release that understands it (framework 13.35 added the
      # QUERY method, Wayfinder 0.1.22 added support for it) and the type check fails.
      # Packages listed here are updated as soon as a release exists, with the rest of
      # the group.
      exclude:
        - "laravel/wayfinder"
    groups:
      composer:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    # TypeScript 7 no longer has the JavaScript API that Vue's compiler uses to read
    # files, so the front end build fails with it. Remove this once Vue supports it.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # vite-plus needs the vite alias in package.json on exactly the same version, and
      # Dependabot can only change one of the two, which fails the build. Update both
      # by hand instead (see "Updating Vite+" in the README).
      - dependency-name: "vite-plus"
      - dependency-name: "vite"
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"
